    <!-- Custom 404 Page Styles -->
    <style>
      .error-page {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px 20px;
        position: relative;
        overflow: hidden;
      }

      .error-page::before {
        content: "";
        position: absolute;
        top: -100px;
        right: -100px;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(139, 92, 246, 0.1) 0%,
          transparent 70%
        );
        border-radius: 50%;
        animation: float 6s ease-in-out infinite;
      }

      .error-page::after {
        content: "";
        position: absolute;
        bottom: -100px;
        left: -100px;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(6, 182, 212, 0.1) 0%,
          transparent 70%
        );
        border-radius: 50%;
        animation: float 8s ease-in-out infinite reverse;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .error-content {
        position: relative;
        z-index: 1;
        max-width: 600px;
      }

      .error-content h1 {
        font-size: clamp(8rem, 20vw, 12rem);
        font-weight: 900;
        background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
        line-height: 1;
        animation: glitch 3s ease-in-out infinite;
      }

      @keyframes glitch {
        0%,
        90%,
        100% {
          transform: translate(0);
        }
        92% {
          transform: translate(-2px, 2px);
        }
        94% {
          transform: translate(2px, -2px);
        }
        96% {
          transform: translate(-2px, -2px);
        }
        98% {
          transform: translate(2px, 2px);
        }
      }

      .error-content h2 {
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        font-weight: 800;
        color: var(--text-primary);
        margin: 20px 0 15px;
      }

      .error-content p {
        font-size: 1.1rem;
        color: var(--text-secondary);
        max-width: 500px;
        margin: 0 auto 30px;
        line-height: 1.6;
      }

      .error-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .error-btn {
        padding: 14px 30px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 700;
        font-size: 1rem;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .error-btn-primary {
        background: linear-gradient(135deg, #7c3aed, #06b6d4);
        color: white;
        box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
      }

      .error-btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(124, 58, 237, 0.4);
      }

      .error-btn-secondary {
        background: rgba(139, 92, 246, 0.1);
        color: #7c3aed;
        border: 2px solid rgba(139, 92, 246, 0.3);
      }

      .error-btn-secondary:hover {
        background: rgba(139, 92, 246, 0.2);
        transform: translateY(-3px);
      }

      .error-icon {
        font-size: 4rem;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #7c3aed, #06b6d4);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      @media (max-width: 768px) {
        .error-buttons {
          flex-direction: column;
          align-items: center;
        }
        .error-btn {
          width: 100%;
          max-width: 280px;
          justify-content: center;
        }
      }
    </style>
